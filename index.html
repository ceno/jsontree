<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>jsontree — Online JSON Viewer</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="alternate icon" href="favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
  <!-- The appearance chosen with the toolbar's switch, applied before anything
       is drawn so the page never shows the other one first. js/app.js writes
       this key. -->
  <script>try { var t = localStorage.getItem('jsontree-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
</head>
<body>
  <div id="app" class="app">

    <!-- Unified toolbar: wordmark and mode switch, then the actions, with the
         search field on the right. The switch names the view it leads to:
         Edit over the tree, View in the editor. The actions are the tree's
         (tb-view) or the source editor's (tb-edit), and only one set shows
         at a time. The search field is there in both: it finds rows over the
         tree and text in the editor. Last, the appearance switch. -->
    <div id="toolbar">
      <div class="brand"><span class="brand-mark">{ }</span><span class="brand-name">jsontree</span></div>
      <button class="tb-btn tb-mode" id="btn-edit" title="Edit the source">
        <svg class="mode-icon mode-icon-edit" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M10.9 2.6l2.5 2.5-7.7 7.7-3.1.6.6-3.1z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M9.3 4.2l2.5 2.5" stroke="currentColor" stroke-width="1.4"/></svg>
        <svg class="mode-icon mode-icon-view" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M2.5 3.5h6M8 8h5.5M8 12.5h5.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M4 6v6.5h1.5M4 8h1.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="mode-label" id="btn-edit-label">Edit</span>
      </button>
      <span class="tb-sep"></span>
      <button class="tb-btn tb-view" id="btn-copy" title="Copy the selected value">Copy</button>
      <button class="tb-btn tb-view" id="btn-copy-path" title="Copy the selected path (⌘⌥C)">Copy Path</button>
      <span class="tb-sep tb-view"></span>
      <button class="tb-btn tb-view" id="btn-expand-all" title="Expand all (⌘⌥→)">Expand All</button>
      <button class="tb-btn tb-view" id="btn-collapse-all" title="Collapse all (⌘⌥←)">Collapse All</button>
      <button class="tb-btn tb-edit" id="btn-format" title="Re-indent with two spaces">Format</button>
      <button class="tb-btn tb-edit" id="btn-minify" title="Remove all whitespace">Minify</button>
      <div class="tb-spacer"></div>
      <div class="search-field" id="search-field">
        <svg class="search-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M11.2 11.2 14.5 14.5M12.8 7.4A5.4 5.4 0 1 1 2 7.4a5.4 5.4 0 0 1 10.8 0Z" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        <input type="text" id="search-input" placeholder="Search" autocomplete="off" spellcheck="false" aria-label="Search" title="Search (⌘F)">
        <span class="search-count" id="search-count" aria-live="polite"></span>
        <button class="search-nav" id="search-prev" aria-label="Previous match" title="Previous match (⇧⌘G)" disabled>
          <svg viewBox="0 0 8 6" fill="none" aria-hidden="true"><path d="M1 4.5 4 1.5 7 4.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="search-nav" id="search-next" aria-label="Next match" title="Next match (⌘G)" disabled>
          <svg viewBox="0 0 8 6" fill="none" aria-hidden="true"><path d="M1 1.5 4 4.5 7 1.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="search-clear" id="search-clear" aria-label="Clear search" title="Clear (Esc)">
          <svg viewBox="0 0 10 10" fill="none" aria-hidden="true"><path d="M1.5 1.5 8.5 8.5M8.5 1.5 1.5 8.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        </button>
      </div>
      <button class="tb-theme" id="btn-theme" aria-label="Switch between light and dark" title="Switch between light and dark">
        <svg class="theme-icon-moon" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M14 8.53A6 6 0 1 1 7.47 2 4.67 4.67 0 0 0 14 8.53Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
        <svg class="theme-icon-sun" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="3" stroke="currentColor" stroke-width="1.4"/><path d="M8 1v1.5M8 13.5V15M1 8h1.5M13.5 8H15M3.05 3.05l1.05 1.05M11.9 11.9l1.05 1.05M3.05 12.95l1.05-1.05M11.9 4.1l1.05-1.05" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      </button>
    </div>

    <!-- Content: the tree, the empty state, or the source editor -->
    <div id="content-wrap">
      <div id="tree-scroll"><div id="tree-container"></div></div>

      <div id="empty-state">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 3h11l5 5v13a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z" stroke="currentColor" stroke-width="1.3"/><path d="M15 3v5h5" stroke="currentColor" stroke-width="1.3"/></svg>
        <div class="empty-title">No document</div>
        <div class="empty-hint">Press <kbd>Edit</kbd> and paste JSON.</div>
      </div>

      <!-- The text is drawn twice: the textarea takes the typing but its
           glyphs are transparent, and the coloured copy behind it is what
           shows. Behind that again, search paints its matches. -->
      <div id="edit-wrap">
        <div id="edit-gutter" aria-hidden="true"><div id="edit-gutter-inner"><div id="edit-line-numbers"></div></div></div>
        <div id="edit-code">
          <div id="edit-marks" aria-hidden="true"></div>
          <div id="edit-highlight" aria-hidden="true"></div>
          <textarea id="edit-area" spellcheck="false" autocomplete="off"
                    placeholder="Paste the JSON code here (your code is not saved anywhere)"
                    aria-label="JSON source"></textarea>
        </div>
      </div>
    </div>

    <!-- One status bar, the same height in every state -->
    <div id="statusbar">
      <span id="status-left"></span>
      <div id="status-spacer"></div>
      <span id="status-path" class="hint">⌘F Search</span>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>jsontree — Online JSON Viewer</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- Tab strip -->
    <div id="tab-strip">
      <div class="tab" id="tab-viewer" data-tab="viewer">Viewer</div>
      <div class="tab" id="tab-text" data-tab="text">Text</div>
    </div>

    <!-- Tab panels -->
    <div id="panels">

      <!-- Text panel -->
      <div id="panel-text" class="panel active">
        <div class="toolbar" id="text-toolbar">
          <div class="toolbar-left">
            <button class="tb-btn" id="btn-paste">Paste</button>
            <button class="tb-btn" id="btn-copy">Copy</button>
            <span class="tb-sep"></span>
            <button class="tb-btn" id="btn-format">Format</button>
            <button class="tb-btn" id="btn-minify">Remove white space</button>
            <span class="tb-sep"></span>
            <button class="tb-btn" id="btn-clear">Clear</button>
          </div>
          <div class="toolbar-right">
            <button class="tb-btn" id="btn-about">About</button>
          </div>
        </div>
        <textarea id="json-input" placeholder="Paste the JSON code here (your code is not saved anywhere)" spellcheck="false"></textarea>
        <div id="status-bar"><span id="status-text"></span></div>
      </div>

      <!-- Viewer panel -->
      <div id="panel-viewer" class="panel">
        <div id="viewer-inner">
          <div id="tree-panel">
            <div id="tree-container"></div>
            <div id="search-toolbar" class="toolbar">
              <label class="tb-label">Search:</label>
              <input type="text" id="search-input" class="search-input">
              <button class="tb-btn" id="btn-search-go">GO!</button>
              <span class="tb-sep"></span>
              <button class="tb-btn icon-btn" id="btn-search-next">
                Next <span class="arrow-down"></span>
              </button>
              <button class="tb-btn icon-btn" id="btn-search-prev">
                Previous <span class="arrow-up"></span>
              </button>
            </div>
          </div>

          <div id="splitter"></div>

          <div id="grid-panel">
            <div id="grid-header">
              <div class="grid-header-cell" id="grid-col-name" data-col="name">
                Name <span class="sort-arrow" id="sort-arrow-name">▲</span>
              </div>
              <div class="grid-header-cell" id="grid-col-value" data-col="value">
                Value <span class="sort-arrow hidden" id="sort-arrow-value">▲</span>
              </div>
            </div>
            <div id="grid-body"></div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- Modal overlay -->
  <div id="modal-overlay" class="hidden">
    <div id="modal-window">
      <div id="modal-titlebar">
        <span id="modal-title"></span>
        <button id="modal-close-btn" aria-label="Close">&#x2715;</button>
      </div>
      <div id="modal-body">
        <div id="modal-error-icon" class="hidden">
          <svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true">
            <circle cx="16" cy="16" r="15" fill="#cc0000" stroke="#aa0000" stroke-width="1"/>
            <line x1="9" y1="9" x2="23" y2="23" stroke="white" stroke-width="3" stroke-linecap="round"/>
            <line x1="23" y1="9" x2="9" y2="23" stroke="white" stroke-width="3" stroke-linecap="round"/>
          </svg>
        </div>
        <p id="modal-message"></p>
      </div>
      <div id="modal-footer">
        <button id="modal-ok-btn">OK</button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>

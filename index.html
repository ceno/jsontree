<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>jsontree — Online JSON Viewer</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="alternate icon" href="favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app" class="app">

    <!-- Unified toolbar: wordmark and mode switch, then the actions, with
         search on the right. The switch names the view it leads to: Edit over
         the tree, View in the editor. Copy is always the first action; the
         rest are the tree's (tb-view) or the source editor's (tb-edit), and
         only one set shows at a time. -->
    <div id="toolbar">
      <div class="brand"><span class="brand-mark">{ }</span><span class="brand-name">jsontree</span></div>
      <button class="tb-btn tb-mode" id="btn-edit" title="Edit the source">
        <svg class="mode-icon mode-icon-edit" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M10.9 2.6l2.5 2.5-7.7 7.7-3.1.6.6-3.1z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M9.3 4.2l2.5 2.5" stroke="currentColor" stroke-width="1.4"/></svg>
        <svg class="mode-icon mode-icon-view" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M2.5 3.5h6M8 8h5.5M8 12.5h5.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M4 6v6.5h1.5M4 8h1.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="mode-label" id="btn-edit-label">Edit</span>
      </button>
      <span class="tb-sep"></span>
      <button class="tb-btn" id="btn-copy" title="Copy all">Copy</button>
      <button class="tb-btn tb-view" id="btn-copy-path" title="Copy the selected path (⌘⌥C)">Copy Path</button>
      <button class="tb-btn tb-edit" id="btn-paste" title="Replace with the clipboard">Paste</button>
      <span class="tb-sep"></span>
      <button class="tb-btn tb-view" id="btn-expand-all" title="Expand all (⌘⌥→)">Expand All</button>
      <button class="tb-btn tb-view" id="btn-collapse-all" title="Collapse all (⌘⌥←)">Collapse All</button>
      <button class="tb-btn tb-edit" id="btn-format" title="Re-indent with two spaces">Format</button>
      <button class="tb-btn tb-edit" id="btn-minify" title="Remove all whitespace">Minify</button>
      <div class="tb-spacer"></div>
      <button class="tb-icon-btn" id="btn-find-open" aria-label="Find (⌘F)" title="Find (⌘F)">
        <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.6"/><line x1="11" y1="11" x2="15" y2="15" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
      <button class="tb-icon-btn" id="btn-palette-open" aria-label="Commands (⌘K)" title="Commands (⌘K)">
        <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="1.5" y="1.5" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.4"/><rect x="9.5" y="1.5" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.4"/><rect x="1.5" y="9.5" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.4"/><rect x="9.5" y="9.5" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.4"/></svg>
      </button>
    </div>

    <!-- Find bar: summoned with ⌘F, collapses to zero height when closed -->
    <div id="findbar">
      <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.6"/><line x1="11" y1="11" x2="15" y2="15" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <input id="find-input" placeholder="Find in document" autocomplete="off" spellcheck="false" aria-label="Find">
      <span id="find-count">0 of 0</span>
      <button class="find-nav-btn" id="find-prev" aria-label="Previous match" title="Previous (⇧⌘G)">
        <svg viewBox="0 0 10 10" fill="none" aria-hidden="true"><path d="M2 6.5L5 3.5L8 6.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="find-nav-btn" id="find-next" aria-label="Next match" title="Next (⌘G)">
        <svg viewBox="0 0 10 10" fill="none" aria-hidden="true"><path d="M2 3.5L5 6.5L8 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button id="find-done">Done</button>
    </div>

    <!-- Content: the tree, the empty state, or the source editor -->
    <div id="content-wrap">
      <div id="tree-scroll"><div id="tree-container"></div></div>

      <div id="empty-state">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 3h11l5 5v13a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z" stroke="currentColor" stroke-width="1.3"/><path d="M15 3v5h5" stroke="currentColor" stroke-width="1.3"/></svg>
        <div class="empty-title">No document</div>
        <div class="empty-hint">Press <kbd>Edit</kbd> and paste JSON, or press <kbd>⌘K</kbd> and choose Paste.</div>
      </div>

      <div id="edit-wrap">
        <div id="edit-gutter"><div id="edit-gutter-inner"></div></div>
        <textarea id="edit-area" spellcheck="false" autocomplete="off"
                  placeholder="Paste the JSON code here (your code is not saved anywhere)"
                  aria-label="JSON source"></textarea>
      </div>
    </div>

    <!-- One status bar, the same height in every state -->
    <div id="statusbar">
      <span id="status-left"></span>
      <div id="status-spacer"></div>
      <span id="status-path" class="hint">⌘K Commands · ⌘F Find</span>
    </div>
  </div>

  <div id="palette-overlay">
    <div id="palette" role="dialog" aria-label="Command palette">
      <input id="palette-input" placeholder="Type a command…" autocomplete="off" spellcheck="false" aria-label="Command">
      <div id="palette-list" role="listbox"></div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
